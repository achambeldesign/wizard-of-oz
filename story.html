    <!-- Importmap -->

<!------------------ Mensagem -> not available on mobile ------------------>
<div id="versao-mobile" lang="en" role="alert">
    <h1>Toto, I’ve a feeling we’re not on the right device anymore.</h1>
    <p>Please try on a computer or tablet.</p>
 </div>
    
<!--------------------------- História --------------------------->
<div class="container-historia">

    <div class="historia" id="historia">
        <!-- Bússula N, S, E. W-->
        <div class="story-hud-grid">
            <div id="estado-atual" class="estado-atual" data-mode="default">
                <div class="bussula" aria-hidden="true">
                    <span class="direcao direcao-norte">
                        <span class="linha"></span>
                        <span class="letra-direcional" data-compass-key="n">N</span>
                    </span>
                    <span class="direcao direcao-sul">
                        <span class="linha"></span>
                        <span class="letra-direcional" data-compass-key="s">S</span>
                    </span>
                    <span class="direcao direcao-oeste">
                        <span class="linha"></span>
                        <span class="letra-direcional" data-compass-key="w">W</span>
                    </span>
                    <span class="direcao direcao-este">
                        <span class="linha"></span>
                        <span class="letra-direcional" data-compass-key="e">E</span>
                    </span>
                </div>
        </div>

        <!-- Tijolos Amarelos - Yellow Brick Road (barras progressão) -->
        <div class="barras" id="barras"></div>

        <!-- Controlos N, S, E, W - solução para tablets -->
        <div class="story-direction-controls" role="group" aria-label="Controlos da história">
            <button class="story-direction-button" type="button" data-story-key="n" aria-label="Cena anterior">N</button>
            <button class="story-direction-button" type="button" data-story-key="s" aria-label="Cena seguinte">S</button>
            <button class="story-direction-button" type="button" data-story-key="e" aria-label="Filme">E</button>
            <button class="story-direction-button" type="button" data-story-key="w" aria-label="Livro">W</button>
        </div>
    </div>

    <!------------------ Pop-up Instruções overlay ------------------>
    <div class="popup-overlay">
        <div class="nuvens" data-cloud-background data-show-house="false" data-movement-direction="right" aria-hidden="true"></div>
            <canvas class="instructions-canvas"></canvas>
            <button class="popup-close" aria-label="Close pop-up" title="Close">
                <svg viewBox="0 0 278 278" aria-hidden="true" focusable="false">
                    <path d="M208.5 69.5L69.5 208.5M69.5 69.5L208.5 208.5" />
                </svg>
            </button>
     </div>
