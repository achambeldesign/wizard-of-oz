    <link rel="icon" href="img/light_default.PNG" type="image/x-icon" media="(prefers-color-scheme: light)">  <!-- light mode -->

            "imports": {

<!--------------------------- Story --------------------------->
<div class="container-historia">


<div class="historia" id="historia">

    <div class="story-hud-grid">
    <div id="estado-atual" class="estado-atual" data-direction="center">
        <div class="rosa-ventos" aria-hidden="true">
            <span class="rosa-ponto rosa-ponto-norte">N</span>
            <span class="rosa-ponto rosa-ponto-oeste">W</span>
            <span class="rosa-ponto rosa-ponto-este">E</span>
            <span class="rosa-ponto rosa-ponto-sul">S</span>
            <svg class="rosa-estrela" viewBox="0 0 100 100">
                <path d="M50 15 58 42 85 50 58 58 50 85 42 58 15 50 42 42Z" />
                <circle cx="50" cy="50" r="4" />
            </svg>
            <span class="rosa-bola"></span>
        </div>
    </div>

    <div class="barras" id="barras"></div>

    <div class="story-direction-controls" role="group" aria-label="Controlos da história">
        <button class="story-direction-button story-direction-button--north" type="button" data-story-key="n" aria-label="Cena anterior">N</button>
        <button class="story-direction-button story-direction-button--west" type="button" data-story-key="w" aria-label="Livro">W</button>
        <button class="story-direction-button story-direction-button--east" type="button" data-story-key="e" aria-label="Filme">E</button>
        <button class="story-direction-button story-direction-button--south" type="button" data-story-key="s" aria-label="Cena seguinte">S</button>
    </div>

    </div>

   <!------------------ Pop-up Instruções overlay ------------------>
    <div id="popup-folha" class="popup-overlay">
       <div class="nuvens" data-show-house="false" data-movement-direction="right" aria-hidden="true"></div>
       <canvas id="instructions"></canvas>
       <button id="fechar-popup" class="popup-close" aria-label="Fechar pop-up" title="Close">
                <img src="img/x.PNG" alt="close" width="500" height="500" >
            </button>
    </div>
