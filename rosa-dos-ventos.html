<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rosa dos Ventos</title>
<style>
  :root{
    --bg:#f5f5f7; --fg:#1d1d1f; --stroke:#1d1d1f; --accent:#3b82f6; --accent2:#8b5cf6; --muted:#86868b; --card:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#0f0f12; --fg:#f5f5f7; --stroke:#f5f5f7; --accent:#60a5fa; --accent2:#a78bfa; --muted:#9a9aa0; --card:#1c1c1f; }
  }
  :root[data-theme="dark"]{ --bg:#0f0f12; --fg:#f5f5f7; --stroke:#f5f5f7; --accent:#60a5fa; --accent2:#a78bfa; --muted:#9a9aa0; --card:#1c1c1f; }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:20px; padding:24px;
    padding-top:calc(24px + env(safe-area-inset-top,0px));
    padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  }
  h1{font-size:17px; font-weight:600; margin:0; color:var(--muted);}
  .wrap{position:relative; width:min(300px,78vw); aspect-ratio:1; container-type:inline-size;}
  svg{width:100%; height:100%; display:block;}
  .rotor{position:absolute; inset:0; width:100%; height:100%; transition:transform .7s cubic-bezier(.34,1.4,.4,1);}
  .planet{
    position:absolute; left:50%; top:50%; width:30px; height:30px;
    border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #ffffff, var(--accent) 45%, var(--accent2) 100%);
    box-shadow:0 0 16px 2px color-mix(in srgb, var(--accent) 55%, transparent), 0 0 0 4px var(--bg);
    transition:transform .7s cubic-bezier(.34,1.4,.4,1);
    transform:translate(-50%,-50%) translateY(0cqw) rotate(0deg);
    z-index:3;
  }
  .center-dot{
    position:absolute; left:50%; top:50%; width:8px; height:8px; margin:-4px;
    border-radius:50%; background:var(--muted); opacity:.45;
    transition:opacity .3s, background .3s; z-index:2;
  }
  .center-dot.active-default{ background:var(--accent); opacity:.9; }
  .pulse{
    position:absolute; left:50%; top:50%; width:8px; height:8px; margin:-4px;
    border-radius:50%; border:2px solid var(--accent); opacity:0; pointer-events:none; z-index:1;
  }
  .pulse.animate{ animation: pulseOut .6s ease-out; }
  @keyframes pulseOut{
    0%{ transform:scale(1); opacity:.8; }
    100%{ transform:scale(5); opacity:0; }
  }
  .label{
    position:absolute; font-size:14px; font-weight:700; color:var(--muted); letter-spacing:.04em;
    transition:color .3s, transform .3s;
  }
  .label.active{color:var(--accent); transform:scale(1.15);}
  .controls{display:flex; gap:10px;}
  button{
    width:50px;height:50px;border-radius:50%;border:1px solid var(--muted);
    background:var(--card); color:var(--fg); font-weight:700; font-size:14px; cursor:pointer;
    transition:transform .15s, background .15s, color .15s, border-color .15s;
  }
  button:hover{transform:translateY(-2px);}
  button.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .status{color:var(--muted); font-size:13px; font-weight:600; min-height:18px;}
  .hint{color:var(--muted); font-size:12.5px; text-align:center; opacity:.8;}
</style>
</head>
<body>
  <h1>Rosa dos Ventos</h1>
  <div class="wrap" id="wrap">
    <svg viewBox="0 0 300 300">
      <circle cx="150" cy="150" r="130" fill="none" stroke="var(--stroke)" stroke-width="2" opacity="0.5"/>
      <line x1="150" y1="20" x2="150" y2="280" stroke="var(--stroke)" stroke-width="1" opacity="0.22"/>
      <line x1="20" y1="150" x2="280" y2="150" stroke="var(--stroke)" stroke-width="1" opacity="0.22"/>
    </svg>
    <div class="label" id="lbl-N" style="top:-2px; left:50%; transform:translateX(-50%);">N</div>
    <div class="label" id="lbl-E" style="top:50%; right:-2px; transform:translateY(-50%);">E</div>
    <div class="label" id="lbl-S" style="bottom:-2px; left:50%; transform:translateX(-50%);">S</div>
    <div class="label" id="lbl-W" style="top:50%; left:-2px; transform:translateY(-50%);">W</div>
    <div class="pulse" id="pulse"></div>
    <div class="center-dot" id="centerDot"></div>
    <div class="rotor" id="rotor">
      <div class="planet" id="planet"></div>
    </div>
  </div>
  <div class="status" id="status">Default (centro)</div>
  <div class="controls">
    <button data-dir="N" id="btn-N">N</button>
    <button data-dir="E" id="btn-E">E</button>
    <button data-dir="S" id="btn-S">S</button>
    <button data-dir="W" id="btn-W">W</button>
  </div>
  <div class="hint">Clica numa tecla para ir até lá. Clica de novo para voltar ao centro (default).</div>

<script>
  const rotor = document.getElementById('rotor');
  const planet = document.getElementById('planet');
  const centerDot = document.getElementById('centerDot');
  const pulse = document.getElementById('pulse');
  const status = document.getElementById('status');
  const angles = { N:0, E:90, S:180, W:270 };
  const names = { N:'Norte', E:'Este', S:'Sul', W:'Oeste' };
  let current = 0;
  let selectedDir = null;

  function setActiveUI(){
    document.querySelectorAll('button').forEach(b=>b.classList.toggle('active', b.dataset.dir===selectedDir));
    document.querySelectorAll('.label').forEach(l=>l.classList.toggle('active', selectedDir!==null && l.id==='lbl-'+selectedDir));
  }

  function triggerPulse(){
    pulse.classList.remove('animate');
    void pulse.offsetWidth;
    pulse.classList.add('animate');
  }

  function applyState(withPulse){
    if(selectedDir === null){
      planet.style.transform = `translate(-50%,-50%) translateY(0cqw) rotate(${-current}deg)`;
      centerDot.classList.add('active-default');
      status.textContent = 'Default (centro)';
      if(withPulse) triggerPulse();
    } else {
      const target = angles[selectedDir];
      const delta = ((target - (current % 360)) + 540) % 360 - 180;
      current += delta;
      rotor.style.transform = `rotate(${current}deg)`;
      planet.style.transform = `translate(-50%,-50%) translateY(-43.333cqw) rotate(${-current}deg)`;
      centerDot.classList.remove('active-default');
      status.textContent = 'Selecionado: ' + names[selectedDir];
    }
    setActiveUI();
  }

  const toggleable = ['E','W'];
  const isOpposite = (a,b) => (a==='E'&&b==='W') || (a==='W'&&b==='E');

  function growFromCenter(newDir){
    selectedDir = newDir;
    status.textContent = 'Selecionado: ' + names[newDir];
    centerDot.classList.remove('active-default');
    setActiveUI();

    // como o raio está a 0, o ângulo pode ser ajustado sem que se veja rodar
    current = angles[newDir];
    rotor.style.transition = 'none';
    rotor.style.transform = `rotate(${current}deg)`;
    void rotor.offsetWidth;
    rotor.style.transition = '';

    // cresce em linha reta a partir do centro, já no ângulo certo
    planet.style.transform = `translate(-50%,-50%) translateY(-43.333cqw) rotate(${-current}deg)`;
  }

  function linearSwap(newDir){
    selectedDir = newDir;
    status.textContent = 'Selecionado: ' + names[newDir];
    setActiveUI();

    // fase 1: encolhe até ao centro, em linha reta, mantendo o ângulo atual
    planet.style.transition = 'transform .35s ease-in';
    planet.style.transform = `translate(-50%,-50%) translateY(0cqw) rotate(${-current}deg)`;

    setTimeout(()=>{
      // passa pelo centro: roda instantaneamente para o novo ângulo (invisível, raio=0)
      current = angles[newDir];
      rotor.style.transition = 'none';
      rotor.style.transform = `rotate(${current}deg)`;
      void rotor.offsetWidth;
      rotor.style.transition = '';

      // fase 2: cresce em linha reta a partir do centro, já no novo ângulo
      planet.style.transition = 'transform .35s ease-out';
      planet.style.transform = `translate(-50%,-50%) translateY(-43.333cqw) rotate(${-current}deg)`;

      setTimeout(()=>{ planet.style.transition = ''; }, 370);
    }, 350);
  }

  function toggle(dir){
    if(selectedDir === dir){
      if(toggleable.includes(dir)){
        selectedDir = null;
        applyState(true);
      }
      // N e S: já estão selecionados, clicar de novo não faz nada
      return;
    }
    if(selectedDir !== null && isOpposite(selectedDir, dir)){
      linearSwap(dir);
      return;
    }
    if(selectedDir === null){
      growFromCenter(dir);
      return;
    }
    selectedDir = dir;
    applyState(true);
  }

  document.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>toggle(b.dataset.dir));
  });

  window.addEventListener('keydown', (e)=>{
    const k = e.key.toUpperCase();
    if(['N','S','E','W'].includes(k)) toggle(k);
    else if(e.key==='ArrowUp') toggle('N');
    else if(e.key==='ArrowRight') toggle('E');
    else if(e.key==='ArrowDown') toggle('S');
    else if(e.key==='ArrowLeft') toggle('W');
  });

  applyState(false);
</script>
</body>
</html>
