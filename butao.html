<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface de Seleção</title>
    <style>
        body {
            background-color: #333; /* Cor de fundo cinza escuro */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            display: flex;
            align-items: center;
            background-color: black; /* Cor de fundo da barra preta */
            border-radius: 25px; /* Borda arredondada */
            padding: 10px;
        }

        .circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin: 0 5px; /* Espaçamento entre os círculos */
            cursor: pointer;
            transition: background-color 0.3s ease; /* Transição suave de cor */
        }

        .circle.inactive {
            background-color: #555; /* Cor dos círculos inativos */
        }

        .circle.active {
            background-color: white; /* Cor do círculo ativo */
        }

        /* Estilo para o círculo grande que envolve o ativo */
        .active-container {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: black; /* Círculo grande que envolve o ativo */
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- O primeiro círculo será o ativo inicialmente -->
        <div class="active-container">
            <div class="circle active" id="circle1"></div>
        </div>
        <div class="circle inactive" id="circle2"></div>
        <div class="circle inactive" id="circle3"></div>
        <div class="circle inactive" id="circle4"></div>
        <div class="circle inactive" id="circle5"></div>
    </div>

    <script>
        // Lógica de movimentação com as teclas W, S, N, E (interpretadas como W, S, A, D)
        const circles = [
            document.getElementById('circle1'),
            document.getElementById('circle2'),
            document.getElementById('circle3'),
            document.getElementById('circle4'),
            document.getElementById('circle5')
        ];

        let currentIndex = 0; // Índice do círculo ativo atualmente

        document.addEventListener('keydown', (event) => {
            const key = event.key.toLowerCase();
            let newIndex = currentIndex;

            if (key === 'w' || key === 'n') { // Cima / Norte
                newIndex = Math.max(0, currentIndex - 1); // Vai para a esquerda
            } else if (key === 's') { // Baixo / Sul
                newIndex = Math.min(circles.length - 1, currentIndex + 1); // Vai para a direita
            } else if (key === 'a') { // Esquerda / Oeste
                 newIndex = Math.max(0, currentIndex - 1); // Vai para a esquerda
            } else if (key === 'd' || key === 'e') { // Direita / Leste
                 newIndex = Math.min(circles.length - 1, currentIndex + 1); // Vai para a direita
            }

            // Atualiza a interface visual se o índice mudou
            if (newIndex !== currentIndex) {
                // Remove a classe 'active' e o contêiner do antigo
                const oldCircle = circles[currentIndex];
                oldCircle.classList.remove('active');
                oldCircle.classList.add('inactive');
                const oldActiveContainer = oldCircle.parentElement;
                oldActiveContainer.replaceWith(oldCircle);

                // Adiciona a classe 'active' e o contêiner para o novo
                currentIndex = newIndex;
                const newCircle = circles[currentIndex];
                newCircle.classList.remove('inactive');
                newCircle.classList.add('active');
                const newActiveContainer = document.createElement('div');
                newActiveContainer.classList.add('active-container');
                newCircle.parentNode.insertBefore(newActiveContainer, newCircle);
                newActiveContainer.appendChild(newCircle);
            }
        });
    </script>
</body>
</html>
